            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {

            border-radius: 18px;

            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .brand {
            text-align: center;
            color: #111827;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                W
            </div>

            <div class="brand">
                WorkFlowX
            </div>

            <div class="subtitle">
                Project & Task Management System
            </div>

            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">

                    <input

                        id="password"

                    class="login-button">

                </button>

            </form>

            <p class="register-text">

                Don't have an account?

                <a href="{{ url_for('auth.register') }}">
                    Register
                </a>

            </p>

        </div>

        <div class="footer-text">
            WorkFlowX • Manage Projects. Track Tasks. Work Better.
        </div>

    </div>

</body>

</html>
