 
{% extends "base.html" %}

{% block title %}
Edit Employee | WorkFlowX
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1>Edit Employee</h1>

        <p class="text-muted">
            Update employee information.
        </p>
    </div>

    <a
        href="{{ url_for('main.employees') }}"
        class="btn btn-outline-secondary">

        ← Back to Employees

    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form
            method="POST"
            action="{{ url_for('main.edit_employee', user_id=employee.id) }}">

            <!-- CSRF PROTECTION -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}">


            <!-- NAME -->

            <div class="mb-3">

                <label
                    for="name"
                    class="form-label">

                    Employee Name

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    value="{{ employee.name }}"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="mb-4">

                <label
                    for="email"
                    class="form-label">

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    value="{{ employee.email }}"
                    required>

            </div>


            <!-- BUTTONS -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Update Employee

                </button>

                <a
                    href="{{ url_for('main.employees') }}"
                    class="btn btn-outline-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
