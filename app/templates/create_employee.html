
{% extends "base.html" %}

{% block title %}
Create Employee | WorkFlowX
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1>Create Employee</h1>

        <p class="text-muted">
            Add a new employee to your organization.
        </p>
    </div>

    <a
        href="{{ url_for('main.employees') }}"
        class="btn btn-outline-secondary">

        ← Back to Employees

    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form
            method="POST"
            action="{{ url_for('main.create_employee') }}">

            <!-- CSRF PROTECTION -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}">


            <!-- NAME -->
            <div class="mb-3">

                <label
                    for="name"
                    class="form-label">

                    Employee Name

                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter employee name"
                    value="{{ request.form.get('name', '') }}"
                    required>

            </div>


            <!-- EMAIL -->
            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter employee email"
                    value="{{ request.form.get('email', '') }}"
                    required>

            </div>


            <!-- PASSWORD -->
            <div class="mb-4">

                <label
                    for="password"
                    class="form-label">

                    Temporary Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter temporary password"
                    required>

                <small class="text-muted">
                    Give this temporary password to the employee.
                </small>

            </div>


            <!-- BUTTONS -->
            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Create Employee

                </button>

                <a
                    href="{{ url_for('main.employees') }}"
                    class="btn btn-outline-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
